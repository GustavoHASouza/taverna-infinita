name: Build Android APK (Capacitor Fullscreen)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Web Dependencies & Build Game
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android & Sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Taverna-Infinita.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taverna-Infinita-APK
          path: Taverna-Infinita.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 Taverna-Infinita.apk \
            --title "Taverna Infinita v1.0.0 (APK Android)" \
            --notes "APK Android nativo em tela cheia (sem barra de navegador) de Taverna Infinita: Crônicas do Caldeirão Dourado." \
            || gh release upload v1.0.0 Taverna-Infinita.apk --clobber
